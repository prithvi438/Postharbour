# Initial HTTP virtual host. Certbot adds the certificate and HTTPS redirect.
server {
    listen 80;
    server_name postharbor.easyhai.in;
    access_log /var/log/nginx/postharbor.access.log;
    error_log /var/log/nginx/postharbor.error.log;
    client_max_body_size 25m;

    # The Go backend calls JMAP with mailbox credentials. Only this server may
    # reach the engine over this virtual host; the browser uses /api/webmail.
    location ~ ^/(jmap/|\.well-known/jmap$) {
        allow 127.0.0.1;
        allow 72.62.226.177;
        deny all;
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 45s;
    }

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 45s;
    }
}
